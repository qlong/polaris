# Persistence: relational-jdbc backed by PostgreSQL (required for multi-table transactions).
#
# auto-bootstrap-types: tells the server to run schema DDL and create the root principal on
# startup for both persistence backends.  JdbcMetaStoreManagerFactory.bootstrapRealms is
# idempotent — if the realm is already bootstrapped it logs a warning and continues rather
# than crashing.  start-polaris.sh always drops and recreates the database before starting
# the server, so bootstrap runs on a clean slate every time.
polaris.persistence.type=relational-jdbc
polaris.persistence.auto-bootstrap-types=in-memory,relational-jdbc
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/polaris
quarkus.datasource.username=polaris
quarkus.datasource.password=polaris

# Feature flags for local FILE-based storage
polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true
polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE","S3","GCS","AZURE"]
polaris.features."ALLOW_OVERLAPPING_CATALOG_URLS"=true
polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION"=true
polaris.features."DROP_WITH_PURGE_ENABLED"=true
polaris.readiness.ignore-severe-issues=true
