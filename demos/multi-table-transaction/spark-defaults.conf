# ---------------------------------------------------------------------------
# spark-defaults.conf — Polaris REST Catalog configuration for the demo.
#
# Usage:
#   source spark-env.sh   # sets POLARIS_TOKEN, ICEBERG_JAR, POLARIS_PLUGIN_JAR
#   $SPARK_HOME/bin/spark-sql \
#       --jars $ICEBERG_JAR,$POLARIS_PLUGIN_JAR \
#       --properties-file spark-defaults.conf
#
# Or for spark-shell (Scala REPL):
#   $SPARK_HOME/bin/spark-shell \
#       --jars $ICEBERG_JAR,$POLARIS_PLUGIN_JAR \
#       --properties-file spark-defaults.conf
# ---------------------------------------------------------------------------

# Iceberg extensions + Polaris transaction SQL (BEGIN / COMMIT / ROLLBACK)
spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.apache.polaris.spark.PolarisSqlExtensions

# Register the Polaris REST catalog under the name "polaris"
# org.apache.polaris.spark.SparkCatalog wraps Iceberg's SparkCatalog and adds transaction support.
spark.sql.catalog.polaris               org.apache.polaris.spark.SparkCatalog
# catalog-impl is NOT needed — org.apache.polaris.spark.SparkCatalog always uses REST internally.

# Disable client-side table cache — required for REPEATABLE READ to work.
# With caching on, Spark reuses a stale LoadTableResponse instead of the pinned snapshot.
spark.sql.catalog.polaris.cache-enabled false
spark.sql.catalog.polaris.uri           http://localhost:8181/api/catalog
spark.sql.catalog.polaris.warehouse     demo_catalog

# Make polaris the default catalog so unqualified names (demo_ns.orders) resolve correctly.
spark.sql.defaultCatalog                polaris

# Authentication — credential is exchanged for a short-lived token automatically
spark.sql.catalog.polaris.credential    root:s3cr3t
spark.sql.catalog.polaris.scope         PRINCIPAL_ROLE:ALL
spark.sql.catalog.polaris.token-refresh-enabled  true

# Disable Hive metastore (not needed; REST catalog is the only catalog in this demo)
spark.sql.catalogImplementation         in-memory

# Disable Iceberg REST metrics reporting — the root principal does not have REPORT_*_METRICS
# privilege; these 403 errors are benign noise but distracting in a demo.
spark.sql.catalog.polaris.rest-metrics-reporting-enabled  false
