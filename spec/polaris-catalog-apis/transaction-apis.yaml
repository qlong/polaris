---
paths:

  # ---------------------------------------------------------------------------
  # TxnSnapshot: exportable consistent-read handles
  # ---------------------------------------------------------------------------
  /polaris/v1/{prefix}/transaction-snapshots:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'

    post:
      tags:
        - Transaction API
      summary: Acquire a consistent read snapshot
      description: >
        Creates a read snapshot capturing a single read_point (a commit-order cutoff) and
        returns it as an opaque `txn_snapshot` handle. The caller echoes the handle on subsequent
        loadTable?txn_snapshot=<handle> calls to get a consistent multi-table view pinned to this
        read point. Standalone read snapshots hold no server row: they are not addressable by id
        (no GET/DELETE/renew) and are reclaimed by time-based GC once their lease elapses.
      operationId: createTransactionSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionSnapshotRequest'
      responses:
        200:
          description: Snapshot acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSnapshot'
        400:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        503:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServerErrorResponse'

  # These by-id endpoints address only write-linked snapshot rows (REPEATABLE_READ transactions).
  # Standalone read snapshots are handle-only and TTL-reclaimed — they are not addressable here.
  /polaris/v1/{prefix}/transaction-snapshots/{txn-snapshot-id}:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-snapshot-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Transaction API
      summary: Get a write-linked transaction snapshot by row ID
      operationId: getTransactionSnapshot
      responses:
        200:
          description: Snapshot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSnapshot'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'

    delete:
      tags:
        - Transaction API
      summary: Release a transaction snapshot
      description: Explicitly releases the snapshot, advancing the watermark sooner.
      operationId: releaseTransactionSnapshot
      responses:
        204:
          description: Released
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'

  /polaris/v1/{prefix}/transaction-snapshots/{txn-snapshot-id}/renew:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-snapshot-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Renew a transaction snapshot lease
      operationId: renewTransactionSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLeaseRequest'
      responses:
        200:
          description: Renewed snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSnapshot'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'

  # ---------------------------------------------------------------------------
  # Transactions: full lifecycle (BEGIN / COMMIT / ABORT)
  # ---------------------------------------------------------------------------
  /polaris/v1/{prefix}/transactions:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'

    post:
      tags:
        - Transaction API
      summary: Begin a new multi-table transaction
      operationId: beginTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginTransactionRequest'
      responses:
        200:
          description: Transaction started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        400:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        503:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServerErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Transaction API
      summary: Get transaction status
      operationId: getTransaction
      responses:
        200:
          description: Transaction status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/commit:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Commit a transaction (finalize all subtransactions atomically)
      description: >
        When the optional `tables` body is provided the server uses the inline single-session path
        (Use Case 1): it performs conflict detection and pointer-swaps directly from the staged
        metadata files listed in the body.
        When the body is absent or `tables` is empty the server reads pre-registered subtransactions
        (Use Case 2 multi-app path).
      operationId: commitTransaction
      parameters:
        - name: X-Txn-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitTransactionRequest'
      responses:
        204:
          description: Transaction committed — all tables now visible atomically
        400:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        409:
          description: Conflict — concurrent write conflict detected during finalize
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        503:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServerErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/abort:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Abort a transaction and release all locks
      operationId: abortTransaction
      parameters:
        - name: X-Txn-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        204:
          description: Transaction aborted
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/renew:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Renew a transaction lease
      operationId: renewTransaction
      parameters:
        - name: X-Txn-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLeaseRequest'
      responses:
        200:
          description: Renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'

  # ---------------------------------------------------------------------------
  # Subtransactions: per-table units of work inside a transaction
  # ---------------------------------------------------------------------------
  /polaris/v1/{prefix}/transactions/subtransactions/{subtxn-id}:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: subtxn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Transaction API
      summary: Get a subtransaction by ID
      description: >
        Looks up a subtransaction by its ID and validates ownership via X-Subtxn-Token.
        Returns the parent txn_id, txn_snapshot_id, assigned_staging_path, and table_uuid
        so that a worker session can enter worker mode without the orchestrator passing
        those values explicitly.
      operationId: getSubtransaction
      parameters:
        - name: X-Subtxn-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Subtransaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubtransactionResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/subtransactions:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Create a subtransaction for a single table
      description: >
        Allocates a per-table operation inside the parent transaction.
        Acquires a pessimistic lock if the operation requires one
        (ROW_DELTA, OVERWRITE, EXCLUSIVE, ACCESS_EXCLUSIVE).
        Returns a server-assigned staging path for the worker app to write to.
      operationId: createSubtransaction
      parameters:
        - name: X-Txn-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubtransactionRequest'
      responses:
        200:
          description: Subtransaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtransaction'
        400:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        409:
          description: Lock conflict — cannot acquire lock for this resource right now
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/subtransactions/{subtxn-id}/commit:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subtxn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Stage a whole subtransaction for commit
      description: >
        Stages every table in this subtransaction atomically. The server already assigned each
        operation's staging path at create time, so no body is needed: the server verifies
        each staged metadata file exists at its assigned path, marks every operation
        SUB_COMMITTED, and marks the subtransaction STAGED. The data is not yet visible; visibility
        occurs only when the parent transaction is committed. A subtransaction is executed by a single
        worker, so staging is all-or-nothing.
      operationId: commitSubtransaction
      parameters:
        - name: X-Subtxn-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        204:
          description: Subtransaction staged successfully
        400:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/subtransactions/{subtxn-id}/abort:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subtxn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Abort a single subtransaction
      operationId: abortSubtransaction
      parameters:
        - name: X-Subtxn-Token
          in: header
          description: Either the subtxn token (worker) or the txn token (orchestrator) is accepted
          schema:
            type: string
        - name: X-Txn-Token
          in: header
          schema:
            type: string
      responses:
        204:
          description: Subtransaction aborted
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/subtransactions/{subtxn-id}/rollback:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subtxn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Roll back a subtransaction (abort its operations; optionally reopen for retry)
      description: >
        Aborts every operation in the subtransaction and releases their locks. When `reopen_for_retry` is
        true (the default) the subtransaction is reopened with an incremented attempt so it can be re-staged,
        possibly by a different worker; when false the subtransaction stays aborted and the parent COMMIT
        skips it. Other subtransactions' staged work is untouched. Accepts either the subtransaction token
        (X-Subtxn-Token) or the parent txn token (X-Txn-Token).
      operationId: rollbackSubtransaction
      parameters:
        - name: X-Subtxn-Token
          in: header
          schema:
            type: string
        - name: X-Txn-Token
          in: header
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackSubtransactionRequest'
      responses:
        204:
          description: Subtransaction rolled back
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'

  /polaris/v1/{prefix}/transactions/{txn-id}/subtransactions/{subtxn-id}/renew:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'
      - name: txn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subtxn-id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Transaction API
      summary: Renew a subtransaction lease
      operationId: renewSubtransaction
      parameters:
        - name: X-Subtxn-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLeaseRequest'
      responses:
        200:
          description: Renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtransaction'
        404:
          description: Not Found - The requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'

components:
  schemas:

    TransactionIsolation:
      type: string
      enum:
        - READ_COMMITTED
        - REPEATABLE_READ
      default: REPEATABLE_READ

    TransactionStatus:
      type: string
      enum:
        - IN_PROGRESS
        - COMMITTED
        - ABORTED

    SubtransactionStatus:
      type: string
      enum:
        - IN_PROGRESS
        - COMMITTED
        - ABORTED

    LockMode:
      type: string
      enum:
        - ROW_EXCLUSIVE
        - EXCLUSIVE
        - ACCESS_EXCLUSIVE

    CreateTransactionSnapshotRequest:
      type: object
      properties:
        lease_seconds:
          type: integer
          default: 300
          description: How long the snapshot remains valid (default 5 minutes)

    TransactionSnapshot:
      type: object
      required:
        - txn_snapshot
      properties:
        txn_snapshot:
          type: string
          description: >
            Opaque, server-minted read-point handle. The client stores it and echoes it
            verbatim on loadTable?txn_snapshot=<handle> for consistent reads. Standalone read
            snapshots carry no server row and are not addressable by id — they are reclaimed by
            time-based GC once their lease elapses, so there is no GET/DELETE/renew for a handle.
        read_point:
          type: integer
          format: int64
          description: >
            Commit-order high-water-mark at snapshot time (informational). A committed table
            snapshot is visible under this handle iff its commit_scn <= read_point.
        expires_at:
          type: string
          format: date-time

    BeginTransactionRequest:
      type: object
      properties:
        isolation:
          $ref: '#/components/schemas/TransactionIsolation'
        lease_seconds:
          type: integer
          default: 3600
          description: Transaction lease duration in seconds (default 1 hour)

    Transaction:
      type: object
      required:
        - txn_id
        - status
        - expires_at
      properties:
        txn_id:
          type: integer
          format: int64
        txn_token:
          type: string
          description: >
            Opaque token held by the orchestrator. Required for commit/abort/renew.
            Only returned on beginTransaction — subsequent getTransaction calls omit it.
        status:
          $ref: '#/components/schemas/TransactionStatus'
        isolation:
          $ref: '#/components/schemas/TransactionIsolation'
        txn_snapshot_id:
          type: integer
          format: int64
          description: >
            Pinned read snapshot row ID (set for REPEATABLE_READ transactions). Row-backed:
            the write path owns this row for locking/revocation/abort.
        txn_snapshot:
          type: string
          description: >
            Opaque read-point handle derived from the pinned snapshot (set for REPEATABLE_READ).
            Echo it on loadTable?txn_snapshot=<handle> for consistent reads — the uniform string
            read wire shared with standalone read snapshots.
        expires_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time

    SubtransactionTable:
      type: object
      description: One table's contribution to a subtransaction.
      required:
        - table_identifier
        - operation
      properties:
        table_identifier:
          type: string
          description: "Fully-qualified table name, e.g. 'ns.orders'"
        operation:
          $ref: '#/components/schemas/LockMode'
        base_snapshot_id:
          type: integer
          format: int64
          description: Iceberg snapshot ID the worker read this table from

    CreateSubtransactionRequest:
      type: object
      description: >
        Creates a subtransaction (savepoint) grouping one or more per-table operations
        that succeed-or-fail together. Provide either the multi-table `tables` list (preferred) or
        the single-table `table_identifier` + `operation` shorthand. A subtransaction is the retry boundary:
        rolling it back aborts exactly its operations and reopens the subtransaction for another attempt,
        possibly by a different worker.
      properties:
        tables:
          type: array
          description: Tables grouped into this subtransaction. Preferred over the single-table shorthand.
          items:
            $ref: '#/components/schemas/SubtransactionTable'
        table_identifier:
          type: string
          description: "Single-table shorthand. Fully-qualified table name, e.g. 'ns.orders'."
        operation:
          $ref: '#/components/schemas/LockMode'
        name:
          type: string
          description: >
            Optional stable name for the subtransaction (savepoint name / worker task key). Reusing a
            non-aborted name within the same transaction is rejected; a name freed by rollback
            can be reused.
        lease_seconds:
          type: integer
          default: 3600
        retry_of_subtxn_id:
          type: integer
          format: int64
          description: >
            If this subtransaction retries a previously aborted one,
            set this to the old subtxn_id so the server can chain the lineage.

    SubtransactionOperation:
      type: object
      description: One table's per-op state within a subtransaction.
      required:
        - op_id
        - table_uuid
        - operation
        - assigned_staging_path
        - status
      properties:
        op_id:
          type: integer
          format: int64
        op_token:
          type: string
          description: Opaque token for staging this single table's metadata. Only on create.
        table_uuid:
          type: string
        operation:
          $ref: '#/components/schemas/LockMode'
        base_snapshot_id:
          type: integer
          format: int64
        assigned_staging_path:
          type: string
          description: "Server-assigned path for staged metadata"
        staged_metadata_location:
          type: string
          description: Filled in after this table is staged
        status:
          $ref: '#/components/schemas/SubtransactionStatus'

    Subtransaction:
      type: object
      description: >
        A subtransaction grouping one or more per-table operations. The `operations` list carries each
        table's op id/token/staging path. The top-level single-table fields mirror the first
        operation for the single-table shorthand path.
      required:
        - subtxn_id
        - parent_txn_id
        - status
        - expires_at
      properties:
        subtxn_id:
          type: integer
          format: int64
          description: The subtransaction id.
        subtxn_token:
          type: string
          description: >
            Opaque token for this subtransaction. Given to the worker app; drives stage/rollback of the
            whole subtransaction. Only returned on createSubtransaction.
        parent_txn_id:
          type: integer
          format: int64
        txn_snapshot_id:
          type: integer
          format: int64
          description: >
            The parent transaction's pinned snapshot row id (REPEATABLE READ), or null for a
            READ COMMITTED parent. Row-backed (owned by the write path).
        txn_snapshot:
          type: string
          description: >
            The parent transaction's pinned read-point handle (REPEATABLE READ), or null for a
            READ COMMITTED parent. A resuming worker echoes this on loadTable?txn_snapshot=<handle>
            to pin all of its reads — including tables it does not own — to the parent's read point,
            so every read in the subtransaction shares the parent's read point.
        name:
          type: string
          description: Optional stable subtransaction name (savepoint name / worker task key).
        attempt:
          type: integer
          description: 1-based attempt counter; incremented each time the subtransaction is rolled back and retried.
        operations:
          type: array
          description: Per-table operations grouped into this subtransaction.
          items:
            $ref: '#/components/schemas/SubtransactionOperation'
        table_uuid:
          type: string
          description: First operation's table (single-table shorthand mirror).
        operation:
          $ref: '#/components/schemas/LockMode'
        base_snapshot_id:
          type: integer
          format: int64
          description: First operation's base snapshot (single-table shorthand mirror).
        assigned_staging_path:
          type: string
          description: First operation's staging path (single-table shorthand mirror).
        staged_metadata_location:
          type: string
          description: First operation's staged location (single-table shorthand mirror).
        status:
          $ref: '#/components/schemas/SubtransactionStatus'
        expires_at:
          type: string
          format: date-time

    CommitTransactionRequest:
      type: object
      description: >
        Optional body for commitTransaction. When `tables` is non-empty the server uses the inline
        single-session commit path; when absent or empty the server reads pre-registered
        subtransactions (multi-app path).
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/StagedTableCommit'

    StagedTableCommit:
      type: object
      required:
        - table_identifier
        - staged_metadata_location
        - operation
      properties:
        table_identifier:
          type: string
          description: "Fully-qualified table name, e.g. 'ns.orders'"
        staged_metadata_location:
          type: string
          description: Full path to the client-staged Iceberg metadata JSON file
        operation:
          $ref: '#/components/schemas/LockMode'

    RollbackSubtransactionRequest:
      type: object
      properties:
        reopen_for_retry:
          type: boolean
          default: true
          description: >
            When true (default) the subtransaction is reopened (attempt++) after its operations are aborted,
            so it can be re-staged. When false the subtransaction stays aborted and is skipped at commit.

    RenewLeaseRequest:
      type: object
      properties:
        lease_seconds:
          type: integer
          default: 3600

    GetSubtransactionResponse:
      type: object
      required:
        - txn_id
        - assigned_staging_path
        - table_uuid
      properties:
        txn_id:
          type: integer
          format: int64
          description: Parent transaction ID
        txn_snapshot_id:
          type: integer
          format: int64
          description: Pinned read snapshot row ID (null for READ_COMMITTED transactions)
        txn_snapshot:
          type: string
          description: >
            Pinned read-point handle (null for READ_COMMITTED transactions). A resuming worker
            echoes this on loadTable?txn_snapshot=<handle> for consistent reads.
        assigned_staging_path:
          type: string
          description: Server-assigned path for the worker to write staged metadata
        table_uuid:
          type: string
          description: Fully-qualified table identifier, e.g. 'ns.orders'
